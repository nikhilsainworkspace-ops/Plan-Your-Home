[project]
name = "plan-your-home-saas"
version = "1.0.0"
description = "A lightweight home-planning and project-management SaaS starter"
requires-python = ">=3.11"
dependencies = ["Jinja2==3.1.6", "reportlab==4.4.9"]

[project.optional-dependencies]
server = ["gunicorn==23.0.0; sys_platform != 'win32'"]

[tool.unittest]
start-directory = "tests"

[tool.vercel]
# Explicit WSGI entrypoint for Vercel Python Functions.
entrypoint = "wsgi:app"
